previews:
  generation: "off"

services:
  - type: web
    name: wageshield-demo
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wageshield-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: OBJECT_STORAGE_DRIVER
        value: postgres
      - key: OBJECT_STORAGE_GLOBAL_MAX_BYTES
        value: "3221225472"
      - key: OBJECT_STORAGE_ACCOUNT_MAX_BYTES
        value: "1610612736"
      - key: AI_EVIDENCE_API_KEY
        sync: false
      - key: AI_EVIDENCE_BASE_URL
        value: https://api.featherless.ai/v1
      - key: AI_EVIDENCE_MODEL
        value: Qwen/Qwen3-VL-8B-Instruct
      - key: AI_EVIDENCE_VERIFIER_MODEL
        value: Qwen/Qwen3-VL-8B-Instruct
      - key: AI_EVIDENCE_TIMEOUT_MS
        value: "45000"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: TRUST_FORWARDED_IDENTITY
        value: "false"
      - key: ENABLE_SANDBOX
        value: "false"
      - key: ALLOW_PUBLIC_SIGNUP
        value: "false"
      - key: INVESTOR_EMAIL_ALLOWLIST
        sync: false
      - key: NEXT_PUBLIC_COMPANY_LEGAL_NAME
        sync: false
      - key: NEXT_PUBLIC_COMPANY_JURISDICTION
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_PRIVACY_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SECURITY_EMAIL
        sync: false

  - type: cron
    name: wageshield-retention
    runtime: node
    plan: starter
    region: ohio
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev
    startCommand: npm run retention:sweep
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wageshield-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "2"
      - key: OBJECT_STORAGE_DRIVER
        value: postgres
      - key: OBJECT_STORAGE_GLOBAL_MAX_BYTES
        value: "3221225472"
      - key: OBJECT_STORAGE_ACCOUNT_MAX_BYTES
        value: "1610612736"

databases:
  - name: wageshield-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "18"
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    ipAllowList: []
